<!doctype html>
<html lang="en">
  <head>
    <!-- Basics -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0f" />

    <!--
      ✅ IMPORTANT:
      This is the SPA fallback metadata.
      Your per-page SEO should be set with <Helmet> inside React.
    -->

    <!-- Primary SEO (fallback) -->
    <title>Glo Event Co | Silent Disco & Photo Booth (Selfie Station) in St. Louis</title>
    <meta
      name="description"
      content="Silent Disco & Photo Booth (Selfie Station) rentals in St. Louis & nearby areas. Clean setups, branded overlays, and unforgettable events."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="application-name" content="Glo Event Co" />
    <meta name="author" content="Glo Event Co" />

    <!-- Canonical (fallback) -->
    <link rel="canonical" href="https://www.gloeventco.com/" />

    <!-- Icons / PWA -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Social sharing (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glo Event Co" />
    <meta property="og:title" content="Glo Event Co | Silent Disco & Photo Booth (Selfie Station) in St. Louis" />
    <meta
      property="og:description"
      content="Silent Disco & Photo Booth (Selfie Station) rentals in St. Louis & nearby areas. Clean setups, branded overlays, and unforgettable events."
    />
    <meta property="og:url" content="https://www.gloeventco.com/" />
    <meta property="og:image" content="https://www.gloeventco.com/og.jpg" />
    <meta property="og:image:alt" content="Glo Event Co - Silent Disco and Selfie Station Photo Booth Rentals in St. Louis" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter (fallback) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Glo Event Co | Silent Disco & Photo Booth in St. Louis" />
    <meta
      name="twitter:description"
      content="Silent Disco & Photo Booth (Selfie Station) rentals in St. Louis & nearby areas."
    />
    <meta name="twitter:image" content="https://www.gloeventco.com/og.jpg" />

    <!-- Performance: fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Glo Event Co",
        "url": "https://www.gloeventco.com/",
        "telephone": "+1-314-282-7888",
        "email": "info@gloeventco.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "11123 South Towne Sq. Suite B",
          "addressLocality": "St. Louis",
          "addressRegion": "MO",
          "postalCode": "63123",
          "addressCountry": "US"
        },
        "areaServed": [
          { "@type": "City", "name": "St. Louis" },
          { "@type": "AdministrativeArea", "name": "St. Louis region" }
        ],
        "sameAs": [
          "https://www.facebook.com/gloeventco",
          "https://www.instagram.com/gloeventco"
        ],
        "makesOffer": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Silent Disco Rentals",
              "serviceType": "Silent Disco Headphone Rental"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Selfie Station Photo Booth Rentals",
              "serviceType": "Photo Booth (Selfie Station)"
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
